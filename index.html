<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CalcX — Premium Calculator</title>
  <meta name="description" content="CalcX is a sleek, futuristic calculator with glassmorphism design, calculation history, keyboard support, and light/dark themes." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== Animated Background Canvas ===== -->
  <canvas id="bg-canvas" aria-hidden="true"></canvas>

  <!-- ===== Header ===== -->
  <header class="header" id="header">
    <div class="header__brand">
      <span class="header__logo" aria-hidden="true">⬡</span>
      <h1 class="header__title">Calc<span class="header__title--accent">X</span></h1>
    </div>
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle light/dark theme" title="Toggle theme">
      <span class="theme-toggle__icon theme-toggle__icon--dark" aria-hidden="true">🌙</span>
      <span class="theme-toggle__icon theme-toggle__icon--light" aria-hidden="true">☀️</span>
    </button>
  </header>

  <!-- ===== Main Content ===== -->
  <main class="main">
    <div class="app-container">

      <!-- ===== Calculator ===== -->
      <section class="calculator" id="calculator" aria-label="Calculator">
        <div class="calculator__perspective-wrapper">

          <!-- Display -->
          <div class="display" id="display">
            <div class="display__expression" id="display-expression" aria-live="polite"></div>
            <div class="display__result-row">
              <div class="display__result" id="display-result" aria-live="assertive">0</div>
              <button class="display__copy-btn" id="copy-btn" aria-label="Copy result" title="Copy result">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              </button>
            </div>
          </div>

          <!-- Button Grid -->
          <div class="btn-grid" id="btn-grid">
            <!-- Row 1 -->
            <button class="btn btn--util" data-action="clear">AC</button>
            <button class="btn btn--util" data-action="plus-minus">+/−</button>
            <button class="btn btn--util" data-action="percent">%</button>
            <button class="btn btn--op" data-action="operator" data-value="÷">÷</button>

            <!-- Row 2 -->
            <button class="btn btn--num" data-action="number" data-value="7">7</button>
            <button class="btn btn--num" data-action="number" data-value="8">8</button>
            <button class="btn btn--num" data-action="number" data-value="9">9</button>
            <button class="btn btn--op" data-action="operator" data-value="×">×</button>

            <!-- Row 3 -->
            <button class="btn btn--num" data-action="number" data-value="4">4</button>
            <button class="btn btn--num" data-action="number" data-value="5">5</button>
            <button class="btn btn--num" data-action="number" data-value="6">6</button>
            <button class="btn btn--op" data-action="operator" data-value="−">−</button>

            <!-- Row 4 -->
            <button class="btn btn--num" data-action="number" data-value="1">1</button>
            <button class="btn btn--num" data-action="number" data-value="2">2</button>
            <button class="btn btn--num" data-action="number" data-value="3">3</button>
            <button class="btn btn--op" data-action="operator" data-value="+">+</button>

            <!-- Row 5 -->
            <button class="btn btn--num btn--zero" data-action="number" data-value="0">0</button>
            <button class="btn btn--num" data-action="decimal">.</button>
            <button class="btn btn--util" data-action="backspace" aria-label="Backspace">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/></svg>
            </button>
            <button class="btn btn--equals" data-action="equals">=</button>
          </div>

        </div>
      </section>

      <!-- ===== History Panel ===== -->
      <aside class="history" id="history-panel" aria-label="Calculation history">
        <div class="history__header">
          <h2 class="history__title">History</h2>
          <button class="history__clear-btn" id="clear-history-btn" aria-label="Clear history" title="Clear history">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            Clear
          </button>
        </div>
        <ul class="history__list" id="history-list">
          <!-- History items injected by JS -->
        </ul>
        <p class="history__empty" id="history-empty">No calculations yet</p>
      </aside>

    </div>
  </main>

  <!-- ===== Toast ===== -->
  <div class="toast" id="toast" aria-live="polite" role="status"></div>

  <script src="script.js"></script>
</body>
</html>
